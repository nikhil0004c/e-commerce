<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-Commerce Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>🛒 My E-Commerce Store</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <section>
        <h2>Welcome to My E-Commerce Store</h2>
        <p>Best Deals | Fast Delivery | Quality Products</p>

        <input type="text" placeholder="Search products...">
        <button>Search</button>

        <hr>
    </section>

    <h2>Featured Products</h2>

    <div class="products">

        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="Phone">
            <h3>iPhone 16</h3>
            <p>₹79,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="Laptop">
            <h3>Gaming Laptop</h3>
            <p>₹89,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/200" alt="Headphones">
            <h3>Headphones</h3>
            <p>₹2,999</p>
            <button>Add to Cart</button>
        </div>

    </div>

</main>

<footer>
    <p>&copy; 2026 My E-Commerce Store</p>
</footer>

</body>
</html>
