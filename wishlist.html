<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Wishlist | YONICk</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<!-- ==========================
     HEADER
========================== -->

<header>

    <h1 class="logo">
        YONICk
    </h1>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Products
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="wishlist.html">
            ❤️ Wishlist
            (<span id="wishlist-count">0</span>)
        </a>

        <a href="cart.html">
            🛒 Cart
            (<span id="cart-count">0</span>)
        </a>

    </nav>

</header>



<!-- ==========================
     MAIN
========================== -->

<main>


    <h2 class="heading">
        ❤️ My Wishlist
    </h2>


    <!-- Wishlist products -->

    <div
        id="wishlist-items"
        class="products">

    </div>


    <!-- Empty wishlist message -->

    <div
        id="empty-wishlist"
        class="empty-wishlist"
        style="display:none;">

        <h2>
            ❤️ Your Wishlist is Empty
        </h2>

        <p>
            Save products you love
            and find them here later.
        </p>

        <a
            href="index.html"
            class="continue-shopping">

            🛍️ Continue Shopping

        </a>

    </div>


</main>

========================== -->
